# libint2-python-wheels configuration
# 
# The workflow automatically detects the latest libint2 release
# that has a precompiled tarball (libint-X.Y.Z.tgz).
#
# You can override by specifying a version in workflow_dispatch.

libint:
  # Version is auto-detected from GitHub releases
  # Only releases with precompiled tarballs are used
  source_pattern: "https://github.com/evaleev/libint/releases/download/v{version}/libint-{version}.tgz"

python:
  versions:
    linux: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    macos: ["3.10", "3.11", "3.12", "3.13"]

numpy:
  # Default constraint for numba compatibility
  constraint: "<2.4"
