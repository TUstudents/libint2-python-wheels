# libint2-python-wheels configuration
# 
# This file documents the build configuration.
# The actual build uses libint2's upstream scikit-build-core setup.

libint:
  version: "2.11.2"
  source_url: "https://github.com/evaleev/libint/releases/download/v{version}/libint-{version}.tgz"

python:
  # Python versions to build wheels for
  versions:
    linux: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    macos: ["3.10", "3.11", "3.12", "3.13"]

# Build uses the upstream libint2 python/ directory with scikit-build-core
# See: https://github.com/evaleev/libint/tree/master/python
