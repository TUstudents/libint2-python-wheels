name: Build libint2 Python Wheels

on:
  workflow_dispatch:
    inputs:
      libint_version:
        description: 'libint2 version to build'
        required: true
        default: '2.11.2'
        type: string
      numpy_constraint:
        description: 'Numpy version constraint'
        required: true
        default: '<2.4'
        type: string
      publish_pypi:
        description: 'Publish to PyPI'
        required: false
        default: false
        type: boolean
      publish_test_pypi:
        description: 'Publish to Test PyPI'
        required: false
        default: false
        type: boolean
  
  push:
    tags:
      - 'v*'
  
  schedule:
    - cron: '0 2 * * 0'

env:
  LIBINT_VERSION: ${{ inputs.libint_version || '2.11.2' }}
  NUMPY_CONSTRAINT: ${{ inputs.numpy_constraint || '<2.4' }}

jobs:
  # =============================================================================
  # Build Linux wheels using manylinux container
  # =============================================================================
  build-linux:
    name: Linux - Python ${{ matrix.python-version }}
    runs-on: ubuntu-22.04
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set Python path
        id: python
        run: |
          case "${{ matrix.python-version }}" in
            3.9)  PYTHON_PATH="/opt/python/cp39-cp39/bin/python" ;;
            3.10) PYTHON_PATH="/opt/python/cp310-cp310/bin/python" ;;
            3.11) PYTHON_PATH="/opt/python/cp311-cp311/bin/python" ;;
            3.12) PYTHON_PATH="/opt/python/cp312-cp312/bin/python" ;;
            3.13) PYTHON_PATH="/opt/python/cp313-cp313/bin/python" ;;
          esac
          echo "PYTHON=${PYTHON_PATH}" >> $GITHUB_OUTPUT
          # Add Python bin directory to PATH for cmake to find
          echo "$(dirname ${PYTHON_PATH})" >> $GITHUB_PATH
      
      - name: Install system dependencies
        run: |
          yum install -y \
            cmake3 \
            boost-devel \
            eigen3-devel \
            gmp-devel \
            wget \
            tar \
            gzip
          
          ln -sf /usr/bin/cmake3 /usr/local/bin/cmake || true
      
      - name: Install Python build dependencies
        run: |
          ${{ steps.python.outputs.PYTHON }} -m pip install --upgrade pip
          ${{ steps.python.outputs.PYTHON }} -m pip install \
            build \
            wheel \
            scikit-build-core \
            "pybind11>=3.0.0" \
            numpy
      
      - name: Cache libint2 source
        uses: actions/cache@v4
        id: cache-source
        with:
          path: /tmp/libint-${{ env.LIBINT_VERSION }}
          key: libint2-source-${{ env.LIBINT_VERSION }}
      
      - name: Download libint2 source
        if: steps.cache-source.outputs.cache-hit != 'true'
        run: |
          cd /tmp
          wget -q "https://github.com/evaleev/libint/releases/download/v${{ env.LIBINT_VERSION }}/libint-${{ env.LIBINT_VERSION }}.tgz"
          tar xzf libint-${{ env.LIBINT_VERSION }}.tgz
      
      - name: Build wheel using scikit-build-core
        run: |
          cd /tmp/libint-${{ env.LIBINT_VERSION }}
          
          # Build the wheel from the python directory
          cd python
          
          # Configure and build using scikit-build-core
          ${{ steps.python.outputs.PYTHON }} -m build --wheel \
            --config-setting=cmake.define.CMAKE_BUILD_TYPE=Release \
            --config-setting=cmake.define.LIBINT_VERSION=${{ env.LIBINT_VERSION }}
          
          echo "=== Built wheel ==="
          ls -la dist/
          
          # Repair wheel for manylinux compliance
          mkdir -p /tmp/wheels
          auditwheel repair dist/*.whl -w /tmp/wheels/
          
          echo "=== Repaired wheel ==="
          ls -la /tmp/wheels/
      
      - name: Test wheel
        run: |
          # Install in a clean environment
          ${{ steps.python.outputs.PYTHON }} -m pip install /tmp/wheels/*.whl
          
          # Test import and basic functionality
          ${{ steps.python.outputs.PYTHON }} -c "
          import libint2
          print(f'libint2 imported successfully')
          print(f'MAX_AM = {libint2.MAX_AM}')
          
          # Test creating objects
          atom = libint2.Atom(1, [0.0, 0.0, 0.0])
          print('Created Atom')
          
          shell = libint2.Shell(0, [(1.0, 1.0)], [0.0, 0.0, 0.0])
          print(f'Created Shell with {shell.size()} basis functions')
          
          print('All tests passed!')
          "
      
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-py${{ matrix.python-version }}
          path: /tmp/wheels/*.whl
          retention-days: 7

  # =============================================================================
  # Build macOS x86_64 wheels
  # =============================================================================
  build-macos-x86:
    name: macOS x86_64 - Python ${{ matrix.python-version }}
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install system dependencies
        run: |
          brew install cmake boost eigen gmp
      
      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            build \
            wheel \
            scikit-build-core \
            "pybind11>=3.0.0" \
            numpy \
            delocate
      
      - name: Cache libint2 source
        uses: actions/cache@v4
        id: cache-source
        with:
          path: /tmp/libint-${{ env.LIBINT_VERSION }}
          key: libint2-source-${{ env.LIBINT_VERSION }}
      
      - name: Download libint2 source
        if: steps.cache-source.outputs.cache-hit != 'true'
        run: |
          cd /tmp
          curl -sL "https://github.com/evaleev/libint/releases/download/v${{ env.LIBINT_VERSION }}/libint-${{ env.LIBINT_VERSION }}.tgz" -o libint.tgz
          tar xzf libint.tgz
      
      - name: Build wheel using scikit-build-core
        run: |
          cd /tmp/libint-${{ env.LIBINT_VERSION }}/python
          
          python -m build --wheel \
            --config-setting=cmake.define.CMAKE_BUILD_TYPE=Release \
            --config-setting=cmake.define.LIBINT_VERSION=${{ env.LIBINT_VERSION }}
          
          echo "=== Built wheel ==="
          ls -la dist/
          
          mkdir -p /tmp/wheels
          delocate-wheel -w /tmp/wheels/ dist/*.whl
          
          echo "=== Delocated wheel ==="
          ls -la /tmp/wheels/
      
      - name: Test wheel
        run: |
          python -m pip install /tmp/wheels/*.whl
          python -c "
          import libint2
          print(f'libint2 imported successfully')
          print(f'MAX_AM = {libint2.MAX_AM}')
          atom = libint2.Atom(1, [0.0, 0.0, 0.0])
          shell = libint2.Shell(0, [(1.0, 1.0)], [0.0, 0.0, 0.0])
          print(f'Created Shell with {shell.size()} basis functions')
          print('All tests passed!')
          "
      
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-macos-x86_64-py${{ matrix.python-version }}
          path: /tmp/wheels/*.whl
          retention-days: 7

  # =============================================================================
  # Build macOS ARM64 wheels
  # =============================================================================
  build-macos-arm64:
    name: macOS ARM64 - Python ${{ matrix.python-version }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install system dependencies
        run: |
          brew install cmake boost eigen gmp
      
      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            build \
            wheel \
            scikit-build-core \
            "pybind11>=3.0.0" \
            numpy \
            delocate
      
      - name: Cache libint2 source
        uses: actions/cache@v4
        id: cache-source
        with:
          path: /tmp/libint-${{ env.LIBINT_VERSION }}
          key: libint2-source-${{ env.LIBINT_VERSION }}
      
      - name: Download libint2 source
        if: steps.cache-source.outputs.cache-hit != 'true'
        run: |
          cd /tmp
          curl -sL "https://github.com/evaleev/libint/releases/download/v${{ env.LIBINT_VERSION }}/libint-${{ env.LIBINT_VERSION }}.tgz" -o libint.tgz
          tar xzf libint.tgz
      
      - name: Build wheel using scikit-build-core
        run: |
          cd /tmp/libint-${{ env.LIBINT_VERSION }}/python
          
          python -m build --wheel \
            --config-setting=cmake.define.CMAKE_BUILD_TYPE=Release \
            --config-setting=cmake.define.LIBINT_VERSION=${{ env.LIBINT_VERSION }}
          
          echo "=== Built wheel ==="
          ls -la dist/
          
          mkdir -p /tmp/wheels
          delocate-wheel -w /tmp/wheels/ dist/*.whl
          
          echo "=== Delocated wheel ==="
          ls -la /tmp/wheels/
      
      - name: Test wheel
        run: |
          python -m pip install /tmp/wheels/*.whl
          python -c "
          import libint2
          print(f'libint2 imported successfully')
          print(f'MAX_AM = {libint2.MAX_AM}')
          atom = libint2.Atom(1, [0.0, 0.0, 0.0])
          shell = libint2.Shell(0, [(1.0, 1.0)], [0.0, 0.0, 0.0])
          print(f'Created Shell with {shell.size()} basis functions')
          print('All tests passed!')
          "
      
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-macos-arm64-py${{ matrix.python-version }}
          path: /tmp/wheels/*.whl
          retention-days: 7

  # =============================================================================
  # Create GitHub Release
  # =============================================================================
  release:
    name: Create Release
    needs: [build-linux, build-macos-x86, build-macos-arm64]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    
    permissions:
      contents: write
    
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: wheels/
          merge-multiple: true
      
      - name: List wheels
        run: ls -la wheels/
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: libint2 ${{ env.LIBINT_VERSION }}
          body: |
            ## libint2 Python Wheels v${{ env.LIBINT_VERSION }}
            
            Pre-built Python wheels for libint2 ${{ env.LIBINT_VERSION }}.
            
            ### Installation
            
            ```bash
            pip install libint2-${{ env.LIBINT_VERSION }}-<platform>.whl
            ```
            
            Or install directly from URL:
            
            ```bash
            pip install "libint2 @ https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/<wheel-filename>.whl"
            ```
            
            ### Supported Platforms
            
            - Linux x86_64 (manylinux_2_28)
            - macOS x86_64 (Intel)
            - macOS ARM64 (Apple Silicon)
            
            ### Python Versions
            
            - Linux: 3.9, 3.10, 3.11, 3.12, 3.13
            - macOS: 3.10, 3.11, 3.12, 3.13
          files: wheels/*.whl
          draft: false
          prerelease: false

  # =============================================================================
  # Publish to PyPI (optional)
  # =============================================================================
  publish-pypi:
    name: Publish to PyPI
    needs: [build-linux, build-macos-x86, build-macos-arm64]
    runs-on: ubuntu-latest
    if: inputs.publish_pypi == true
    
    environment:
      name: pypi
      url: https://pypi.org/p/libint2
    
    permissions:
      id-token: write
    
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist/
          merge-multiple: true
      
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  # =============================================================================
  # Publish to Test PyPI (optional)
  # =============================================================================
  publish-test-pypi:
    name: Publish to Test PyPI
    needs: [build-linux, build-macos-x86, build-macos-arm64]
    runs-on: ubuntu-latest
    if: inputs.publish_test_pypi == true
    
    environment:
      name: testpypi
      url: https://test.pypi.org/p/libint2
    
    permissions:
      id-token: write
    
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist/
          merge-multiple: true
      
      - name: Publish to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
